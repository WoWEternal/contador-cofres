name: Build EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: pip install pyinstaller

      - name: Crear el .exe
        run: pyinstaller --onefile --noconsole --name ContadorCofres --add-data "plantilla.png;." --add-data "fuentes;fuentes" contador_cofres.py

      - name: Publicar release con el .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Contador de cofres v${{ github.run_number }}
          files: dist/ContadorCofres.exe
